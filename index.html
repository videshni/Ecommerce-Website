<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Online Shopping Website</h1>

    <section>
        <h2>User Registration</h2>
        <form id="register-form">
            <input id="reg-name" placeholder="Name" required>
            <input id="reg-email" type="email" placeholder="Email" required>
            <input id="reg-password" type="password"
                   placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
    </section>

    <section>
        <h2>User Login</h2>
        <form id="login-form">
            <input id="login-email" type="email" placeholder="Email" required>
            <input id="login-password" type="password"
                   placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <button id="logout-btn">Logout</button>
        <p id="user-status">Not logged in</p>
    </section>

    <section>
        <h2>Product Management</h2>
        <form id="product-form">
            <input id="product-name" placeholder="Product Name" required>
            <input id="product-price" type="number"
                   placeholder="Price" min="1" required>
            <button type="submit">Add Product</button>
        </form>
        <div id="products"></div>
    </section>

    <section>
        <h2>Shopping Cart</h2>
        <div id="cart"></div>
        <button id="checkout-btn">Checkout</button>
    </section>

    <section>
        <h2>Payment</h2>
        <select id="payment-method">
            <option value="UPI">UPI (Demo)</option>
            <option value="Card">Card (Demo)</option>
            <option value="COD">Cash on Delivery</option>
        </select>
    </section>

    <section>
        <h2>Order Management</h2>
        <div id="orders"></div>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
